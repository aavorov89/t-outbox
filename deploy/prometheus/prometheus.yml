# Scrapes the relays' /metrics (METRICS_ADDR, :9464). Compose's relay-1/relay-2 (`make app`)
# and relays started on the host with `make run-relay` (:9464, a second one on :9465) are
# all listed; the ones not running show up=0, which is fine for a dev stack.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: outbox-relay
    static_configs:
      - targets: ["relay-1:9464", "relay-2:9464"]
        labels: {mode: compose}
      - targets: ["host.docker.internal:9464", "host.docker.internal:9465"]
        labels: {mode: host}
