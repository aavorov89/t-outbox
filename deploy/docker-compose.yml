# Local dev stack. Image versions live in deploy/.env (shared with testcontainers).
# Integration tests do NOT use this file; they start their own containers.
#
# Default services: postgres, redpanda, topics (`make up`). The `app` profile adds the
# binaries, built from deploy/Dockerfile: api, two relays and the ledger consumer
# (`make app`, used by `make chaos`).
name: t-outbox

x-app: &app
  image: t-outbox-app:dev
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      GO_IMAGE: ${GO_IMAGE}
      RUNTIME_IMAGE: ${RUNTIME_IMAGE}
  profiles: [app]
  # No restart policy: `make chaos` kills relays with SIGKILL and starts them itself.
  restart: "no"
  environment: &app-env
    DATABASE_URL: postgres://outbox:outbox@postgres:5432/outbox?sslmode=disable
    KAFKA_BROKERS: redpanda:9092

x-after-setup: &after-setup
  migrate:
    condition: service_completed_successfully
  topics:
    condition: service_completed_successfully

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
      POSTGRES_DB: outbox
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbox -d outbox"]
      interval: 2s
      timeout: 3s
      retries: 30

  redpanda:
    image: ${REDPANDA_IMAGE}
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${KAFKA_PORT:-19092}
    ports:
      - "${KAFKA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: create topics with explicit partition counts (no auto-create).
  topics:
    image: ${REDPANDA_IMAGE}
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rpk -X brokers=redpanda:9092 topic create payments.events -p 6 -r 1 --if-not-exists &&
        rpk -X brokers=redpanda:9092 topic create payments.events.dlq -p 1 -r 1 --if-not-exists
    restart: "no"

  migrate:
    <<: *app
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["payments-api"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on: *after-setup

  relay-1: &relay
    <<: *app
    command: ["outbox-relay"]
    depends_on: *after-setup

  relay-2: *relay

  ledger-consumer:
    <<: *app
    command: ["ledger-consumer"]
    depends_on: *after-setup

  # Jaeger is added in M6.

volumes:
  pgdata:
